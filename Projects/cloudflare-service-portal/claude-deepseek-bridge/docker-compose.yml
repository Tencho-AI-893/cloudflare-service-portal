version: '3.8'

services:
  # Ollama コンテナ（GPU サポート）
  ollama:
    image: ollama/ollama:latest
    container_name: claude-deepseek-ollama
    
    # GPU サポート（NVIDIA）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # CPU オンリーの場合は上記をコメントアウト
    
    ports:
      - "11434:11434"
    
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_GPU=1
    
    volumes:
      - ollama_data:/root/.ollama
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # プロキシサーバー（Node.js）
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    
    container_name: claude-deepseek-proxy
    
    depends_on:
      ollama:
        condition: service_healthy
    
    ports:
      - "3000:3000"
    
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=deepseek-coder-v2:16b
      - PROXY_PORT=3000
      - NODE_ENV=production
    
    volumes:
      - ./logs:/app/logs
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama_data:
    driver: local

networks:
  default:
    name: claude-deepseek-network
